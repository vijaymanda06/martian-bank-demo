# ExternalSecret for JWT Configuration
# Syncs JWT secrets from AWS Secrets Manager to Kubernetes Secret
#
# Requirements: 7.1, 7.3
{{- if .Values.externalSecrets.jwt.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.jwt.refreshInterval | default "1h" }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jwt-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        JWT_SECRET: "{{ `{{ .secret }}` }}"
        JWT_EXPIRY: "{{ `{{ .expiry }}` }}"
  data:
    - secretKey: secret
      remoteRef:
        key: {{ .Values.externalSecrets.jwt.secretName }}
        property: secret
    - secretKey: expiry
      remoteRef:
        key: {{ .Values.externalSecrets.jwt.secretName }}
        property: expiry
{{- end }}
