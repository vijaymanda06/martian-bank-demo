# ExternalSecret for MongoDB Credentials
# Syncs MongoDB credentials from AWS Secrets Manager to Kubernetes Secret
#
# Requirements: 7.1, 7.3
{{- if .Values.externalSecrets.mongodb.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.mongodb.refreshInterval | default "1h" }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mongodb-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_URL: "{{ `{{ .uri }}` }}"
        DB_NAME: "{{ `{{ .database }}` }}"
        DB_USERNAME: "{{ `{{ .username }}` }}"
        DB_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: uri
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: uri
    - secretKey: database
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: database
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: password
{{- end }}
