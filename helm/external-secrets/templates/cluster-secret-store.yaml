# ClusterSecretStore for AWS Secrets Manager
# This resource configures the External Secrets Operator to connect to AWS Secrets Manager
#
# Requirements: 7.1, 7.3
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region | default "us-west-2" }}
      {{- if .Values.aws.role }}
      role: {{ .Values.aws.role }}
      {{- end }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name | default "external-secrets" }}
            namespace: {{ .Release.Namespace }}
