# Local Development Docker Compose
# Run with: docker-compose up --build

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: mongo
    hostname: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: bank
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - bankapp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # React UI (Development Server)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    hostname: ui
    image: martian-bank-ui
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
    volumes:
      # Mount source files for hot-reloading (matches WORKDIR /bankapp in Dockerfile)
      - ./ui/src:/bankapp/src:ro
      - ./ui/public:/bankapp/public:ro
      - ./ui/index.html:/bankapp/index.html:ro
    networks:
      - bankapp-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    hostname: nginx
    image: martian-bank-nginx
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      customer-auth:
        condition: service_healthy
      atm-locator:
        condition: service_healthy
      ui:
        condition: service_started
      dashboard:
        condition: service_healthy
    networks:
      - bankapp-network

  # Customer Authentication Service (Node.js)
  customer-auth:
    build:
      context: ./customer-auth
      dockerfile: Dockerfile
    container_name: customer-auth
    hostname: customer-auth
    image: martian-bank-customer-auth
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=8000
      # DATABASE_HOST removed - use DB_URL instead for proper authentication
      - DB_URL=mongodb://root:example@mongo:27017/bank?authSource=admin
      - JWT_SECRET=martianbank_jwt_secret_dev
    # Note: Volume mounts removed to avoid read-only filesystem conflicts
    # For hot-reloading during development, rebuild the container
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bankapp-network
    healthcheck:
      # Use dedicated /health endpoint (unauthenticated) instead of /api/users
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ATM Locator Service (Node.js)
  atm-locator:
    build:
      context: ./atm-locator
      dockerfile: Dockerfile
    container_name: atm-locator
    hostname: atm-locator
    image: martian-bank-atm-locator
    ports:
      - "8001:8001"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=8001
      # DATABASE_HOST removed - use DB_URL instead for proper authentication
      - DB_URL=mongodb://root:example@mongo:27017/bank?authSource=admin
    # Note: Volume mounts removed to avoid read-only filesystem conflicts
    # For hot-reloading during development, rebuild the container
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bankapp-network
    healthcheck:
      # Use dedicated /health endpoint (unauthenticated) instead of /api/atm
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Dashboard Service (Python/Flask)
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: dashboard
    hostname: dashboard
    image: martian-bank-dashboard
    ports:
      - "5000:5000"  # If port 5000 conflicts with macOS AirPlay, disable it in System Settings
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DB_URL=mongodb://root:example@mongo:27017/bank?authSource=admin
      - SERVICE_PROTOCOL=http
      - ACCOUNT_HOST=accounts
      - TRANSACTION_HOST=transactions
      - LOAN_HOST=loan
      - CUSTOMER_AUTH_HOST=customer-auth
      - ATM_LOCATOR_HOST=atm-locator
    # Note: Volume mounts removed to avoid conflicts with non-root user
    depends_on:
      mongo:
        condition: service_healthy
      accounts:
        condition: service_healthy
      transactions:
        condition: service_healthy
      loan:
        condition: service_healthy
    networks:
      - bankapp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Accounts Service (Python/gRPC/Flask)
  accounts:
    build:
      context: .
      dockerfile: accounts/Dockerfile
    container_name: accounts
    hostname: accounts
    image: martian-bank-accounts
    ports:
      - "50051:50051"
    restart: unless-stopped
    environment:
      - DB_URL=mongodb://root:example@mongo:27017/bank?authSource=admin
      - SERVICE_PROTOCOL=http
    # Note: Volume mounts removed to avoid conflicts with non-root user
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bankapp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 50051)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Loan Service (Python/gRPC/Flask)
  loan:
    build:
      context: .
      dockerfile: loan/Dockerfile
    container_name: loan
    hostname: loan
    image: martian-bank-loan
    ports:
      - "50053:50053"
    restart: unless-stopped
    environment:
      - DB_URL=mongodb://root:example@mongo:27017/bank?authSource=admin
      - SERVICE_PROTOCOL=http
    # Note: Volume mounts removed to avoid conflicts with non-root user
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bankapp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 50053)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Transactions Service (Python/gRPC/Flask)
  transactions:
    build:
      context: .
      dockerfile: transactions/Dockerfile
    container_name: transactions
    hostname: transactions
    image: martian-bank-transactions
    ports:
      - "50052:50052"
    restart: unless-stopped
    environment:
      - DB_URL=mongodb://root:example@mongo:27017/bank?authSource=admin
      - SERVICE_PROTOCOL=http
    # Note: Volume mounts removed to avoid conflicts with non-root user
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bankapp-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 50052)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Locust Performance Testing (Optional)
  locust:
    build:
      context: ./performance_locust
      dockerfile: Dockerfile
    container_name: locust
    hostname: locust
    image: martian-bank-locust
    ports:
      - "8089:8089"
    restart: unless-stopped
    profiles:
      - testing
    networks:
      - bankapp-network

networks:
  bankapp-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
