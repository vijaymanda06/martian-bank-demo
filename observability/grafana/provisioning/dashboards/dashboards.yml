# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Martian Bank Dashboards'
    orgId: 1
    folder: 'Martian Bank'
    folderUid: 'martianbank'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
