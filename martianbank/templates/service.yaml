{{/*
Service templates for all Martian Bank services
Requirements: 8.5
*/}}

{{- $fullName := include "martianbank.fullname" . -}}

{{/* Python gRPC Services */}}
{{- if .Values.services.accounts.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-accounts
  labels:
    {{- include "martianbank.labels" . | nindent 4 }}
    app.kubernetes.io/component: accounts
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.accounts.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "martianbank.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: accounts
{{- end }}

