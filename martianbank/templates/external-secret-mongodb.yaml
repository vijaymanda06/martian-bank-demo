{{/*
ExternalSecret for MongoDB Credentials
Syncs MongoDB credentials from AWS Secrets Manager to Kubernetes Secret
Requirements: 7.1, 7.3
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.mongodb.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "martianbank.fullname" . }}-mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "martianbank.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.mongodb.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName | default "aws-secrets-manager" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "martianbank.fullname" . }}-mongodb-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_URL: "{{ `{{ .uri }}` }}"
        DB_NAME: "{{ `{{ .database }}` }}"
        DB_USERNAME: "{{ `{{ .username }}` }}"
        DB_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: uri
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: uri
    - secretKey: database
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: database
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.mongodb.secretName }}
        property: password
{{- end }}
{{- end }}
