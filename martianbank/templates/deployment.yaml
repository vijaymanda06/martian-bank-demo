{{/*
Deployment templates for all Martian Bank services
Requirements: 6.2, 8.5
*/}}

{{- $fullName := include "martianbank.fullname" . -}}
{{- $labels := include "martianbank.labels" . -}}
{{- $serviceAccountName := include "martianbank.serviceAccountName" . -}}

{{/* Python gRPC Services */}}
{{- if .Values.services.accounts.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-accounts
  labels:
    {{- include "martianbank.labels" . | nindent 4 }}
    app.kubernetes.io/component: accounts
spec:
  replicas: {{ .Values.services.accounts.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "martianbank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: accounts
  template:
    metadata:
      labels:
        {{- include "martianbank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: accounts
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: accounts
          image: "{{ .Values.global.image.registry }}/{{ .Values.services.accounts.image.repository }}:{{ .Values.services.accounts.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.services.accounts.port }}
              protocol: TCP
          env:
            - name: SERVICE_PROTOCOL
              value: {{ .Values.env.SERVICE_PROTOCOL | quote }}
          {{- if .Values.externalSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ $fullName }}-mongodb-credentials
          {{- else if .Values.DB_URL }}
          env:
            - name: DB_URL
              value: {{ .Values.DB_URL | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.services.accounts.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}


