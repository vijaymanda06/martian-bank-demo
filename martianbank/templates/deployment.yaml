{{/* Node.js Services */}}
{{- if .Values.services.customerAuth.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-customer-auth
  labels:
    {{- include "martianbank.labels" . | nindent 4 }}
    app.kubernetes.io/component: customer-auth
spec:
  replicas: {{ .Values.services.customerAuth.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "martianbank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: customer-auth
  template:
    metadata:
      labels:
        {{- include "martianbank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: customer-auth
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: customer-auth
          image: "{{ .Values.global.image.registry }}/{{ .Values.services.customerAuth.image.repository }}:{{ .Values.services.customerAuth.image.tag | default .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.services.customerAuth.port }}
              protocol: TCP
          {{- if .Values.externalSecrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ $fullName }}-mongodb-credentials
            - secretRef:
                name: {{ $fullName }}-jwt-config
          {{- end }}
          resources:
            {{- toYaml .Values.services.customerAuth.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}


