spec:
  replicas: {{ .Values.services.ui.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "martianbank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "martianbank.selectorLabels" . | nindent 8 }}
