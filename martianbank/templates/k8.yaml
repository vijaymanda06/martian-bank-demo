{{/*
Legacy Kubernetes resources - kept for backward compatibility
These are only deployed when nginx.enabled is true (legacy mode)
For new deployments, use the unified deployment.yaml and service.yaml templates
*/}}

{{- if and .Values.nginx (eq .Values.nginx.enabled true) }}
apiVersion: apps/v1
kind: Deployment
metadata:
    name: ui-legacy
    labels:
        app: ui-legacy
spec:
    replicas: 1
    selector:
        matchLabels:
            app: ui-legacy
    template:
        metadata:
            labels:
                app: ui-legacy
        spec:
            containers:
                - name: ui
                  image: ghcr.io/cisco-open/martian-bank-demo-ui
                  env: 
                    - name: VITE_USERS_URL
                      value: /api/users
                    - name: VITE_ATM_URL
                      value: /api/atm
                    - name: VITE_ACCOUNTS_URL
                      value: /api/account
                    - name: VITE_TRANSFER_URL
                      value: /api/transaction
                    - name: VITE_LOAN_URL
                      value: /api/loan
---
apiVersion: v1
kind: Service
metadata:
    name: ui-legacy
spec:
    selector:
        app: ui-legacy
    ports:
        - protocol: TCP
          port: 3000
          targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: nginx
    labels:
        app: nginx
spec:
    replicas: 1
    selector:
        matchLabels:
            app: nginx
    template:
        metadata:
            labels:
                app: nginx
        spec:
            containers:
                - name: nginx
                  image: ghcr.io/cisco-open/martian-bank-demo-nginx 
---
apiVersion: v1
kind: Service
metadata:
    name: nginx
spec:
    type: LoadBalancer
    selector:
        app: nginx
    ports:
        - protocol: TCP
          port: 8080
          targetPort: 8080
{{- end }}

{{- if and .Values.locust .Values.locust.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: locust
    labels:
        app: locust
spec:
    replicas: 1
    selector:
        matchLabels:
            app: locust
    template:
        metadata:
            labels:
                app: locust
        spec:
            containers:
                - name: locust
                  image: ghcr.io/cisco-open/martian-bank-demo-locust
                  env:
                    - name: VITE_USERS_URL
                      value: http://customer-auth:8000/api/users
                    - name: VITE_ATM_URL
                      value: http://atm-locator:8001/api/atm
                    - name: VITE_ACCOUNTS_URL
                      value: http://dashboard:5000/account
                    - name: VITE_TRANSFER_URL
                      value: http://dashboard:5000/transaction
                    - name: VITE_LOAN_URL
                      value: http://dashboard:5000/loan
---
apiVersion: v1
kind: Service
metadata:
    name: locust
spec:
    selector:
        app: locust
    ports:
        - protocol: TCP
          port: 8098
          targetPort: 8098
{{- end }}
