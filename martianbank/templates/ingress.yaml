{{/*
Ingress template for AWS ALB
Requirements: 8.5
*/}}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "martianbank.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "martianbank.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                {{- if eq .service "ui" }}
                name: {{ $fullName }}-ui
                port:
                  number: {{ $.Values.services.ui.port }}
                {{- else if eq .service "customerAuth" }}
                name: {{ $fullName }}-customer-auth
                port:
                  number: {{ $.Values.services.customerAuth.port }}
                {{- else if eq .service "atmLocator" }}
                name: {{ $fullName }}-atm-locator
                port:
                  number: {{ $.Values.services.atmLocator.port }}
                {{- else if eq .service "dashboard" }}
                name: {{ $fullName }}-dashboard
                port:
                  number: {{ $.Values.services.dashboard.port }}
                {{- else }}
                name: {{ $fullName }}-{{ .service }}
                port:
                  number: 80
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
