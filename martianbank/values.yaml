# Default values for martianbank.
# This is a YAML-formatted file.

#######################################################################################
## Global Configuration
## Requirements: 8.5

global:
  image:
    # ECR registry URL - override with your AWS account ECR
    registry: ""
    # Image tag - typically set to git SHA during CI/CD
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # AWS region for service integrations
  awsRegion: us-west-1

#######################################################################################
## Service Account Configuration
## Requirements: 6.2 - IRSA support

serviceAccount:
  create: true
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/martianbank-service-role
  name: ""

#######################################################################################
## Service Configurations

services:
  # Python gRPC Services
  accounts:
    enabled: true
    replicas: 2
    image:
      repository: accounts
      tag: ""  # Uses global.image.tag if empty
    port: 50051
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  loan:
    enabled: true
    replicas: 2
    image:
      repository: loan
      tag: ""
    port: 50053
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  transactions:
    enabled: true
    replicas: 2
    image:
      repository: transactions
      tag: ""
    port: 50052
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  dashboard:
    enabled: true
    replicas: 2
    image:
      repository: dashboard
      tag: ""
    port: 5000
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  # Node.js Services
  customerAuth:
    enabled: true
    replicas: 2
    image:
      repository: customer-auth
      tag: ""
    port: 8000
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  atmLocator:
    enabled: true
    replicas: 2
    image:
      repository: atm-locator
      tag: ""
    port: 8001
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  # React UI
  ui:
    enabled: true
    replicas: 2
    image:
      repository: ui
      tag: ""
    port: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"


#######################################################################################
## Ingress Configuration
## Requirements: 8.5 - ALB configuration

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          service: ui
        - path: /api/auth
          pathType: Prefix
          service: customerAuth
        - path: /api/atm
          pathType: Prefix
          service: atmLocator
  tls: []

#######################################################################################
## MongoDB Configuration

mongodb:
  # Use external MongoDB (DocumentDB or Atlas)
  enabled: false
  # For local development with in-cluster MongoDB
  local:
    enabled: false
    image: mongo:7
    port: 27017
    storage: 1Gi

# Environment variables for services
env:
  SERVICE_PROTOCOL: "http"
  # DB_URL is injected via External Secrets when externalSecrets.enabled=true

#######################################################################################
## External Secrets Operator Configuration
## Syncs secrets from AWS Secrets Manager to Kubernetes Secrets
## Requirements: 7.1, 7.3

externalSecrets:
  enabled: false
  secretStoreName: aws-secrets-manager
  
  mongodb:
    enabled: true
    secretName: martianbank/prod/mongodb
    refreshInterval: 1h
  
  jwt:
    enabled: true
    secretName: martianbank/prod/jwt
    refreshInterval: 1h

#######################################################################################
## Pod Security Configuration

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

#######################################################################################
## Autoscaling Configuration

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

#######################################################################################
## Node Selection

nodeSelector: {}
tolerations: []
affinity: {}

#######################################################################################
## Legacy Configuration (for backward compatibility)

nginx:
  enabled: false
  dashboardIP: ""

replicaCount: 1
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}

# Legacy DB_URL - use externalSecrets instead
DB_URL: ""
