# Staging Environment Values for Martian Bank
# This file is automatically updated by CI/CD pipeline for staging deployments

global:
  image:
    registry: ""
    tag: "latest"
    pullPolicy: Always  # Always pull in staging for latest changes
  
  awsRegion: us-west-1
  environment: staging

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Staging uses fewer replicas
services:
  accounts:
    enabled: true
    replicas: 1
    image:
      repository: accounts
      tag: ""
    port: 50051
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  loan:
    enabled: true
    replicas: 1
    image:
      repository: loan
      tag: ""
    port: 50053
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  transactions:
    enabled: true
    replicas: 1
    image:
      repository: transactions
      tag: ""
    port: 50052
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  dashboard:
    enabled: true
    replicas: 1
    image:
      repository: dashboard
      tag: ""
    port: 5000
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  customerAuth:
    enabled: true
    replicas: 1
    image:
      repository: customer-auth
      tag: ""
    port: 8000
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  atmLocator:
    enabled: true
    replicas: 1
    image:
      repository: atm-locator
      tag: ""
    port: 8001
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  ui:
    enabled: true
    replicas: 1
    image:
      repository: ui
      tag: ""
    port: 80
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "50m"

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
  hosts:
    - host: "staging.martianbank.example.com"
      paths:
        - path: /
          pathType: Prefix
          service: ui

mongodb:
  enabled: false
  local:
    enabled: false

env:
  SERVICE_PROTOCOL: "http"

externalSecrets:
  enabled: false

# Relaxed security for staging debugging
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Allow writes for debugging
  runAsNonRoot: true
  runAsUser: 1000

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
