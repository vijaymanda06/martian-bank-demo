# CI/CD Pipeline for Martian Bank
# Enhanced with staging environment, rollback support, and post-deployment validation
# GitOps: CI builds images and updates values.yaml; ArgoCD deploys automatically

name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: write

env:
  AWS_REGION: us-west-1
  EKS_CLUSTER: martianbank-cluster
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # Lint Job - Code Quality
  # ============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python services with ruff
        run: |
          ruff check accounts/ loan/ transactions/ dashboard/ --output-format=github

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: customer-auth/package-lock.json

      - name: Install Node.js dependencies for customer-auth
        working-directory: customer-auth
        run: npm ci

      - name: Lint customer-auth with eslint
        working-directory: customer-auth
        run: npx eslint . --max-warnings=0

  # ============================================================================
  # Test Job - Unit and Integration Tests
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov hypothesis
          pip install -r accounts/requirements.txt

      - name: Run Python smoke tests
        run: |
          pytest tests/accounts/test_smoke.py -v --tb=short --junitxml=test-results.xml --cov=accounts --cov-report=xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: customer-auth/package-lock.json

      - name: Run Node.js tests
        working-directory: customer-auth
        run: |
          npm ci
          npm test -- --ci --coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ============================================================================
  # Security Scanning Job - Vulnerability Detection
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build accounts image for scanning
        run: docker build -t accounts:scan -f accounts/Dockerfile .

      - name: Run Trivy vulnerability scanner on accounts
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'accounts:scan'
          format: 'sarif'
          output: 'trivy-accounts.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Build customer-auth image for scanning
        run: docker build -t customer-auth:scan -f customer-auth/Dockerfile ./customer-auth

      - name: Run Trivy on customer-auth
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'customer-auth:scan'
          format: 'sarif'
          output: 'trivy-customer-auth.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-accounts.sarif'

  # ============================================================================
  # Build Job - Build and Push Docker Images
  # ============================================================================
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - name: accounts
            context: .
            dockerfile: accounts/Dockerfile
          - name: loan
            context: .
            dockerfile: loan/Dockerfile
          - name: transactions
            context: .
            dockerfile: transactions/Dockerfile
          - name: dashboard
            context: .
            dockerfile: dashboard/Dockerfile
          - name: customer-auth
            context: ./customer-auth
            dockerfile: customer-auth/Dockerfile
          - name: atm-locator
            context: ./atm-locator
            dockerfile: atm-locator/Dockerfile
          - name: ui
            context: ./ui
            dockerfile: ui/Dockerfile.prod
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/martianbank-${{ matrix.service.name }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/martianbank-${{ matrix.service.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ============================================================================
  # Deploy to Staging - For staging branch
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update staging values.yaml
        run: |
          yq -i '.global.image.registry = "${{ steps.login-ecr.outputs.registry }}"' martianbank/values-staging.yaml
          yq -i '.global.image.tag = "${{ github.sha }}"' martianbank/values-staging.yaml

      - name: Commit and push staging changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet martianbank/values-staging.yaml; then
            git add martianbank/values-staging.yaml
            git commit -m "chore(staging): update image tag to ${{ github.sha }} [skip ci]"
            git push origin staging
          fi

  # ============================================================================
  # Deploy to Production - For main branch
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Store previous image tag for rollback
        id: previous
        run: |
          PREV_TAG=$(yq '.global.image.tag' martianbank/values.yaml)
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Update production values.yaml
        run: |
          yq -i '.global.image.registry = "${{ steps.login-ecr.outputs.registry }}"' martianbank/values.yaml
          yq -i '.global.image.tag = "${{ github.sha }}"' martianbank/values.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          if ! git diff --quiet martianbank/values.yaml; then
            git add martianbank/values.yaml
            git commit -m "chore(prod): update image tag to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "ArgoCD will detect changes and sync automatically"
          fi

    outputs:
      previous_tag: ${{ steps.previous.outputs.tag }}

  # ============================================================================
  # Post-Deployment Smoke Tests
  # ============================================================================
  smoke-test:
    name: Post-Deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting 60 seconds for ArgoCD to detect and sync changes..."
          sleep 60

      - name: Check deployment status
        run: |
          echo "Checking deployment rollout status..."
          kubectl rollout status deployment/customer-auth -n martianbank --timeout=300s || true
          kubectl rollout status deployment/dashboard -n martianbank --timeout=300s || true
          kubectl rollout status deployment/accounts -n martianbank --timeout=300s || true

      - name: Run health checks
        run: |
          echo "Running health checks..."
          
          # Get service endpoints
          CUSTOMER_AUTH_URL=$(kubectl get svc customer-auth -n martianbank -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          
          if [ -n "$CUSTOMER_AUTH_URL" ]; then
            echo "Testing customer-auth health endpoint..."
            curl -sf "http://${CUSTOMER_AUTH_URL}:8000/health" || echo "Health check failed"
          else
            echo "Using port-forward for health checks..."
            kubectl port-forward svc/customer-auth 8000:8000 -n martianbank &
            sleep 5
            curl -sf http://localhost:8000/health || echo "Health check failed"
          fi

      - name: Verify pods are running
        run: |
          echo "Verifying all pods are running..."
          kubectl get pods -n martianbank
          
          # Check for any pods not in Running state
          NOT_RUNNING=$(kubectl get pods -n martianbank --field-selector=status.phase!=Running -o name | wc -l)
          if [ "$NOT_RUNNING" -gt 0 ]; then
            echo "Warning: Some pods are not in Running state"
            kubectl get pods -n martianbank --field-selector=status.phase!=Running
          fi

  # ============================================================================
  # Rollback Job - Manual trigger for rollback
  # ============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Get previous commit's image tag
        id: rollback
        run: |
          # Get the image tag from the previous commit
          git checkout HEAD~1 -- martianbank/values.yaml
          PREV_TAG=$(yq '.global.image.tag' martianbank/values.yaml)
          echo "Rolling back to tag: $PREV_TAG"
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Update values.yaml with previous tag
        run: |
          git checkout HEAD -- martianbank/values.yaml
          yq -i '.global.image.tag = "${{ steps.rollback.outputs.tag }}"' martianbank/values.yaml

      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add martianbank/values.yaml
          git commit -m "chore(rollback): revert to ${{ steps.rollback.outputs.tag }} [skip ci]"
          git push origin main
          echo "Rollback committed. ArgoCD will sync automatically."
