# CI/CD Pipeline for Martian Bank
# Requirements: 8.1, 8.2, 8.3, 8.4, 8.5, 9.1, 9.2, 10.3, 10.4
# GitOps: CI builds images and updates values.yaml; ArgoCD deploys automatically

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: write  # Required for pushing commits to update values.yaml
  packages: write

env:
  AWS_REGION: us-west-1
  EKS_CLUSTER: martianbank-cluster
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # Lint Job - Requirements: 8.2
  # ============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python linting with ruff
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python services with ruff
        run: |
          ruff check accounts/ loan/ transactions/ dashboard/ --output-format=github

      # Node.js linting with eslint
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: customer-auth/package-lock.json

      - name: Install Node.js dependencies for customer-auth
        working-directory: customer-auth
        run: npm ci

      - name: Lint customer-auth with eslint
        working-directory: customer-auth
        run: npx eslint . --max-warnings=0


  # ============================================================================
  # Test Job - Requirements: 10.3, 10.4
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov hypothesis
          pip install -r accounts/requirements.txt

      - name: Run smoke tests
        run: |
          pytest tests/accounts/test_smoke.py -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ============================================================================
  # Security Scanning Job - Requirements: 8.3
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build accounts image for scanning
        run: |
          docker build -t accounts:scan -f accounts/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'accounts:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Build customer-auth image for scanning
        run: |
          docker build -t customer-auth:scan -f customer-auth/Dockerfile ./customer-auth

      - name: Run Trivy on customer-auth
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'customer-auth:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'


  # ============================================================================
  # Build Job - Requirements: 8.4, 9.1, 9.2
  # ============================================================================
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service:
          - name: accounts
            context: .
            dockerfile: accounts/Dockerfile
          - name: loan
            context: .
            dockerfile: loan/Dockerfile
          - name: transactions
            context: .
            dockerfile: transactions/Dockerfile
          - name: dashboard
            context: .
            dockerfile: dashboard/Dockerfile
          - name: customer-auth
            context: ./customer-auth
            dockerfile: customer-auth/Dockerfile
          - name: atm-locator
            context: ./atm-locator
            dockerfile: atm-locator/Dockerfile
          - name: ui
            context: ./ui
            dockerfile: ui/Dockerfile.prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/martianbank-${{ matrix.service.name }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/martianbank-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================================
  # Deploy Job - Requirements: 8.5, 4 (GitOps)
  # Updates values.yaml with new image tags and commits to Git
  # ArgoCD watches the repo and handles actual deployment to EKS
  # ============================================================================
  deploy:
    name: Update Helm Values for GitOps
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install yq for YAML manipulation
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update values.yaml with new image tag
        run: |
          # Update global image registry and tag
          yq -i '.global.image.registry = "${{ steps.login-ecr.outputs.registry }}"' martianbank/values.yaml
          yq -i '.global.image.tag = "${{ github.sha }}"' martianbank/values.yaml
          
          echo "Updated values.yaml with:"
          echo "  registry: ${{ steps.login-ecr.outputs.registry }}"
          echo "  tag: ${{ github.sha }}"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          # Check if there are changes to commit
          if git diff --quiet martianbank/values.yaml; then
            echo "No changes to values.yaml, skipping commit"
          else
            git add martianbank/values.yaml
            git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "Committed and pushed updated values.yaml"
            echo "ArgoCD will detect changes and sync automatically"
          fi
