# Test Workflow for Martian Bank
# Requirements: 2.1, 2.2, 2.3
#
# This workflow runs tests automatically on pull requests to catch issues early.
# It executes pytest for Python services and jest for Node.js services.

name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # Python Tests - Requirements: 1.1, 1.3, 1.4, 2.1, 2.2, 2.3
  # ============================================================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --junitxml=pytest-results.xml
        continue-on-error: false

      - name: Upload pytest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: pytest-results.xml
          check_name: Python Test Results
          comment_mode: off

  # ============================================================================
  # Node.js Tests - Requirements: 1.2, 1.3, 1.4, 2.1, 2.2, 2.3
  # ============================================================================
  nodejs-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: customer-auth
            path: customer-auth
          - name: atm-locator
            path: atm-locator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: npm ci

      - name: Run jest tests
        working-directory: ${{ matrix.service.path }}
        run: npm test -- --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-results-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/test-results/

  # ============================================================================
  # Test Summary - Requirements: 2.2, 2.3
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [python-tests, nodejs-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.python-tests.result }}" == "failure" ] || [ "${{ needs.nodejs-tests.result }}" == "failure" ]; then
            echo "::error::One or more test jobs failed"
            exit 1
          fi
          echo "All tests passed successfully!"
