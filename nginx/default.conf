server {
    listen 8080;
    server_name localhost;

    # UI frontend
    location / {
        proxy_pass http://ui:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Customer Auth API - removed trailing slash to prevent double-slash routing
    location /api/users {
        proxy_pass http://customer-auth:8000/api/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ATM Locator API - removed trailing slash to prevent double-slash routing
    location /api/atm {
        proxy_pass http://atm-locator:8001/api/atm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard Account API - removed trailing slash to prevent double-slash routing
    location /api/account {
        proxy_pass http://dashboard:5000/account;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard Transaction API - removed trailing slash to prevent double-slash routing
    location /api/transaction {
        proxy_pass http://dashboard:5000/transaction;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard Loan API - removed trailing slash to prevent double-slash routing
    location /api/loan {
        proxy_pass http://dashboard:5000/loan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint for nginx itself
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
